services:
  mysql:
    image: mysql:8
    container_name: mysql-ecommerce
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: db_ecommerce_apellidonombre
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./script.sql:/docker-entrypoint-initdb.d/script.sql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  backend:
    build: .
    container_name: be-ecommerce
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/db_ecommerce_apellidonombre?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=America/Lima
      DB_USER: root
      DB_PASSWORD: root
    ports:
      - "8080:8080"

volumes:
  mysql_data:
